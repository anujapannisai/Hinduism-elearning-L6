<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>அலகு 1 — விநாயகர்</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Tamil","Nirmala UI",Arial,sans-serif;background:#f7fbf8;color:#173b38}
header{text-align:center;padding:28px 18px 22px;background:linear-gradient(135deg,#006f72,#148c70 55%,#d82d76);color:white}
h1{margin:6px 0;font-size:clamp(30px,5vw,46px)}main{max-width:1000px;margin:auto;padding:20px}
.progress{height:9px;background:#ffffff55;border-radius:99px;max-width:520px;margin:15px auto 5px;overflow:hidden}.progress div{height:100%;width:0;background:white}
.modules{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.module{border:2px solid transparent;background:#fff;border-radius:20px;padding:18px;min-height:140px;box-shadow:0 5px 18px #173b3812;cursor:pointer;text-align:left;color:#173b38}
.module:hover{border-color:#63b6a0}.module .icon{font-size:34px}.module b{display:block;margin:8px 0}.module small{color:#657c78}
.hidden{display:none}.back{border:0;background:#e2f2eb;padding:11px 16px;border-radius:12px;font-weight:800;cursor:pointer}
.card{background:white;border-radius:24px;padding:24px;margin-top:15px;box-shadow:0 7px 24px #173b3812}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.answer{border:2px solid #dbece5;background:#f9fffc;border-radius:15px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;color:#173b38}
.answer.correct{background:#dff6e8;border-color:#24955b;color:#145b36}
.answer.wrong{background:#ffe8e8;border-color:#d64d5d;color:#912838}
.feedback{display:none;margin-top:14px;padding:15px;border-radius:14px;font-weight:800;font-size:17px}
.feedback.show{display:block}.feedback.good{background:#dff6e8;color:#145b36}.feedback.bad{background:#ffe8e8;color:#912838}
.note{margin-top:18px;padding:14px;background:#fff7e8;border-radius:14px}
.match-area{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:20px 0}
.match-column{display:grid;gap:10px}
.drag-item,.drop-zone{min-height:58px;border-radius:14px;padding:13px 15px;display:flex;align-items:center;font-weight:800}
.drag-item{background:#fff8e9;border:2px solid #edcf8b;cursor:grab;touch-action:none;gap:12px}.drag-item img{width:96px;height:96px;object-fit:contain;border-radius:12px;background:#fffdf7;flex:0 0 96px}.drag-item .hand-label{line-height:1.25}
.drag-item.selected{outline:4px solid #69b7a1;background:#eefbf6}
.drag-item.matched{background:#dff6e8;border-color:#24955b;cursor:default}
.drop-zone{background:#f7fbff;border:2px dashed #8db8ca;justify-content:space-between}
.drop-zone.correct{background:#dff6e8;border-style:solid;border-color:#24955b}
.match-help{background:#eef9f4;padding:12px 14px;border-radius:12px}
.match-score{font-size:20px;font-weight:900;margin-top:12px}
.sequence{display:grid;gap:10px;margin:18px 0}.sequence-card{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;background:#fffaf0;border:2px solid #edd6a3;border-radius:15px;padding:12px}.sequence-card .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e8f5ef;font-weight:900}.sequence-controls{display:flex;gap:5px}.sequence-controls button{border:0;border-radius:9px;padding:8px 10px;background:#e6f1f7;cursor:pointer;font-weight:900}.sequence-card.correct-pos{border-color:#24955b;background:#effaf3}.check-sequence{border:0;border-radius:13px;padding:13px 18px;background:#147e69;color:white;font-weight:900;cursor:pointer}
@media(max-width:700px){.match-area{grid-template-columns:1fr}{.modules{grid-template-columns:1fr 1fr}.answers{grid-template-columns:1fr}}
@media(max-width:430px){.modules{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div><b>தரம் 6 • இந்து சமயம்</b></div>
<h1>அலகு 1 — விநாயகர்</h1>
<p>விளையாடிக் கற்போம் 🎮</p>
<div class="progress"><div id="bar"></div></div>
<small id="progressText">0 / 8 பயிற்சிகள் நிறைவு</small>
</header>
<main>
<section id="home">
<h2>பயிற்சியைத் தேர்ந்தெடுக்கவும்</h2>
<div class="modules">
<button class="module" data-module="numbers"><span class="icon">🐘</span><b>1 • 2 • 3 • 4 • 5</b><small>விநாயகரின் திருவுருவம்</small></button>
<button class="module" data-module="body"><span class="icon">🧩</span><b>திருமேனி</b><small>மூன்று பகுதிகள்</small></button>
<button class="module" data-module="eyes"><span class="icon">☀️</span><b>மூன்று கண்கள்</b><small>மூன்று ஒளிகள்</small></button>
<button class="module" data-module="hands"><span class="icon">✋</span><b>ஐந்து கரங்கள்</b><small>ஐந்தொழில்கள்</small></button>
<button class="module" data-module="agathiyar"><span class="icon">🐦</span><b>அகத்தியர் கதை</b><small>குட்டிக் கும்பிடுதல்</small></button>
<button class="module" data-module="gaja"><span class="icon">🐭</span><b>கஜமுகாசுரன்</b><small>கதையை நினைவுகூர்வோம்</small></button>
<button class="module" data-module="thoppu"><span class="icon">🙏</span><b>தோப்புக்கரணம்</b><small>சரியான முறை</small></button>
<button class="module" data-module="vratham"><span class="icon">🌸</span><b>21 நாள் விரதம்</b><small>விரதத்தை அறிந்துகொள்வோம்</small></button>
</div>
</section>
<section id="activity" class="hidden">
<button id="back" class="back">← பயிற்சிகள்</button>
<div id="activityBox"></div>
</section>
</main>
<script>
(function(){
"use strict";
const DATA={
numbers:{title:"🐘 1 • 2 • 3 • 4 • 5",question:"விநாயகருக்கு எத்தனை கரங்கள் உள்ளன?",choices:["மூன்று","நான்கு","ஐந்து","ஆறு"],answer:2,note:"1 கொம்பு • 2 செவிகள் • 3 கண்கள் • 4 தோள்கள் • 5 கரங்கள்"},
body:{title:"🧩 விநாயகரின் திருமேனி",question:"இடைக்குக் கீழே உள்ள பகுதி எவ்வாறு அழைக்கப்படுகிறது?",choices:["தேவ உடம்பு","பூத உடம்பு","யானைத் தலை","ஞான சக்தி"],answer:1,note:"இடைக்குக் கீழே — பூத உடம்பு; இடைக்கு மேல் கழுத்து வரை — தேவ உடம்பு; தலை — யானைத் தலை."},
eyes:{title:"☀️🌙🔥 மூன்று கண்கள்",question:"விநாயகரின் மூன்று கண்கள் எவற்றைக் குறிக்கின்றன?",choices:["சூரியன், சந்திரன், அக்னி","பூமி, நீர், காற்று","படைத்தல், காத்தல், அழித்தல்","ஞானம், கிரியை, அருள்"],answer:0,note:"மூன்று கண்கள் — சூரியன் • சந்திரன் • அக்னி"},
hands:{title:"✋ ஐந்து கரங்கள்",question:"மோதகம் ஏந்திய கை எதைக் குறிக்கிறது?",choices:["படைத்தல்","காத்தல்","அழித்தல்","மறைத்தல்"],answer:1,note:"மோதகம் — காத்தல்"},
agathiyar:{title:"🐦 அகத்தியர் கதை",question:"அகத்தியர் கதையுடன் தொடர்புடைய வழிபாடு எது?",choices:["சிதறு தேங்காய்","குட்டிக் கும்பிடுதல்","தோப்புக்கரணம்","பிள்ளையார் சுழி"],answer:1,note:"விநாயகரின் உண்மை உருவத்தை அறிந்த அகத்தியர் தனது நெற்றியின் இருபக்கமும் குட்டிக் கொண்டார்."},
gaja:{title:"🐭 கஜமுகாசுரன்",question:"கஜமுகாசுரன் இறுதியில் எந்த உருவத்தை எடுத்தான்?",choices:["மயில்","காகம்","பெருச்சாளி","சிங்கம்"],answer:2,note:"செருக்கடங்கிய கஜமுகாசுரனை விநாயகர் தனது வாகனமாக ஏற்றுக்கொண்டார்."},
thoppu:{title:"🙏 தோப்புக்கரணம்",question:"சரியான தோப்புக்கரண முறை எது?",choices:["வலது கை → வலக்காது; இடது கை → இடக்காது","இடது கை → வலக்காது; வலது கை → இடக்காது","இரு கைகளும் நெற்றியில்","கைகளை கூப்பி நிற்றல்"],answer:1,note:"கைகள் குறுக்காக இருக்க வேண்டும்; மூன்று முறை தாழ்ந்தெழ வேண்டும்."},
vratham:{title:"🌸 விநாயக சட்டி விரதம்",question:"விநாயக சட்டி விரதம் எத்தனை நாட்கள் அனுட்டிக்கப்படுகிறது?",choices:["6 நாட்கள்","9 நாட்கள்","18 நாட்கள்","21 நாட்கள்"],answer:3,note:"கார்த்திகை மாத தேய்பிறைப் பிரதமை முதல் மார்கழி மாத வளர்பிறைச் சஷ்டித் திதி வரை — 21 நாட்கள்."}
};
const completed=new Set();
const home=document.getElementById("home"), activity=document.getElementById("activity"), box=document.getElementById("activityBox");
document.querySelectorAll("[data-module]").forEach(btn=>{
 btn.addEventListener("click",()=>openModule(btn.dataset.module));
});
document.getElementById("back").addEventListener("click",()=>{activity.classList.add("hidden");home.classList.remove("hidden")});
function openModule(id){
 home.classList.add("hidden"); activity.classList.remove("hidden");
 if(id==="hands"){renderHands();window.scrollTo({top:0,behavior:"smooth"});return;} if(id==="agathiyar"){renderAgathiyar();window.scrollTo({top:0,behavior:"smooth"});return;}
 const m=DATA[id];
 box.innerHTML="";
 const card=document.createElement("div"); card.className="card";
 const h=document.createElement("h2"); h.textContent=m.title; card.appendChild(h);
 const q=document.createElement("p"); q.innerHTML="<b>"+m.question+"</b>"; card.appendChild(q);
 const answers=document.createElement("div"); answers.className="answers";
 const feedback=document.createElement("div"); feedback.className="feedback"; feedback.setAttribute("role","status"); feedback.setAttribute("aria-live","polite");
 m.choices.forEach((choice,index)=>{
   const b=document.createElement("button"); b.className="answer"; b.type="button"; b.textContent=choice;
   b.addEventListener("click",()=>{
      answers.querySelectorAll(".answer").forEach(x=>x.classList.remove("correct","wrong"));
      feedback.className="feedback show";
      if(index===m.answer){
        b.classList.add("correct"); feedback.classList.add("good");
        feedback.textContent="✓ சரி! அருமை!"; completed.add(id); updateProgress();
      }else{
        b.classList.add("wrong"); feedback.classList.add("bad");
        feedback.textContent="✗ இன்னும் இல்லை. மீண்டும் முயற்சி செய்.";
      }
   });
   answers.appendChild(b);
 });
 card.appendChild(answers); card.appendChild(feedback);
 const note=document.createElement("div"); note.className="note"; note.innerHTML="<b>நினைவில் கொள்வோம்:</b> "+m.note; card.appendChild(note);
 box.appendChild(card);
 window.scrollTo({top:0,behavior:"smooth"});
}

const HAND_PAIRS=[
 ["எழுத்தாணி","படைத்தல்","assets/ezhuthaani.png"],
 ["மோதகம்","காத்தல்","assets/modhagam.png"],
 ["அங்குசம்","அழித்தல்","assets/angusam.png"],
 ["பாசம்","மறைத்தல்","assets/paasam.png"],
 ["அமுத கலசம் ஏந்திய துதிக்கை","அருளல்","assets/amutha_kalasam.png"]
];
let selectedHand=null, handMatches=0;

function renderHands(){
 handMatches=0; selectedHand=null; box.innerHTML="";
 const card=document.createElement("div"); card.className="card";
 card.innerHTML=`<h2>ஐந்து கரங்கள் — ஐந்தொழில்கள்</h2>
 <p>ஒவ்வொரு பொருளையும் சரியான தொழிலுடன் பொருத்துங்கள்.</p>
 <div class="match-help">💡 கணினியில் <b>drag & drop</b> செய்யலாம். தொலைபேசி / iPad-ல் ஒரு பொருளைத் தொட்டு, பின்னர் சரியான தொழிலைத் தொடவும்.</div>
 <div class="match-area">
   <div class="match-column" id="dragItems"></div>
   <div class="match-column" id="dropZones"></div>
 </div>
 <div id="matchFeedback" class="feedback" role="status" aria-live="polite"></div>
 <div id="matchScore" class="match-score">0 / 5 சரி</div>
 <div class="note"><b>நினைவில் கொள்வோம்:</b> விநாயகரின் ஐந்து கரங்களும் ஐந்தொழில்களைக் குறிக்கின்றன.</div>`;
 box.appendChild(card);
 const items=[...HAND_PAIRS].sort(()=>Math.random()-.5);
 const zones=[...HAND_PAIRS].map(x=>x[1]).sort(()=>Math.random()-.5);
 const itemBox=document.getElementById("dragItems"), zoneBox=document.getElementById("dropZones");
 items.forEach(([label,answer,img],i)=>{
   const el=document.createElement("div"); el.className="drag-item"; el.draggable=true;
   el.innerHTML=`<img src="${img}" alt=""><span class="hand-label">${label}</span>`; el.dataset.label=label; el.dataset.answer=answer; el.id="hand-"+i;
   el.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",el.id);});
   el.addEventListener("click",()=>selectHand(el));
   itemBox.appendChild(el);
 });
 zones.forEach(answer=>{
   const z=document.createElement("div"); z.className="drop-zone"; z.dataset.answer=answer; z.innerHTML=`<span>${answer}</span><span>⬅️</span>`;
   z.addEventListener("dragover",e=>e.preventDefault());
   z.addEventListener("drop",e=>{e.preventDefault();const el=document.getElementById(e.dataTransfer.getData("text/plain"));tryMatch(el,z);});
   z.addEventListener("click",()=>{if(selectedHand)tryMatch(selectedHand,z);});
   zoneBox.appendChild(z);
 });
}
function selectHand(el){
 if(el.classList.contains("matched"))return;
 document.querySelectorAll(".drag-item").forEach(x=>x.classList.remove("selected"));
 selectedHand=el; el.classList.add("selected");
}
function tryMatch(el,zone){
 if(!el || el.classList.contains("matched") || zone.classList.contains("correct"))return;
 const f=document.getElementById("matchFeedback");
 f.className="feedback show";
 if(el.dataset.answer===zone.dataset.answer){
   el.classList.remove("selected"); el.classList.add("matched"); el.draggable=false;
   zone.classList.add("correct"); zone.lastElementChild.textContent="✓";
   zone.appendChild(el);
   selectedHand=null; handMatches++;
   document.getElementById("matchScore").textContent=handMatches+" / 5 சரி";
   f.classList.add("good"); f.textContent="✓ சரி! "+el.dataset.label+" → "+zone.dataset.answer;
   if(handMatches===5){
      f.textContent="🌟 அருமை! ஐந்து கரங்களையும் ஐந்தொழில்களுடன் சரியாகப் பொருத்திவிட்டீர்கள் — 5 / 5!";
      completed.add("hands"); updateProgress();
   }
 }else{
   el.classList.remove("selected"); selectedHand=null;
   f.classList.add("bad"); f.textContent="✗ அது சரியான பொருத்தம் அல்ல. மீண்டும் முயற்சி செய்.";
 }
}

const AGATHIYAR_STORY=[
 "அகத்தியர் கமண்டலத்துடன் இருந்தார்.",
 "பிள்ளையார் காகமாக உருவெடுத்து வந்து கமண்டலத்தைக் கவிழ்த்தார்.",
 "கமண்டலத்தில் இருந்த காவிரி நீர் பெருக்கெடுத்து ஓடியது.",
 "அகத்தியர் காகத்தைத் துரத்தினார்; காகமாக இருந்த பிள்ளையார் சிறுவனாக மாறினார்.",
 "அகத்தியர் அச்சிறுவனைப் பிடித்துக் குட்ட நினைத்தபோது, பிள்ளையார் தனது உண்மை உருவத்தைக் காட்டினார்.",
 "அகத்தியர் தன்னை நொந்து, தனது நெற்றியின் இருபக்கமும் குட்டிக் கொண்டு அருள் வேண்டினார்."
];
function shuffledStory(){
 let a=AGATHIYAR_STORY.map((text,index)=>({text,index}));
 // deterministic shuffled start so it is always actually mixed
 return [a[2],a[0],a[4],a[1],a[5],a[3]];
}
function renderAgathiyar(){
 box.innerHTML="";
 const card=document.createElement("div"); card.className="card";
 card.innerHTML=`<h2>🐦 அகத்தியர் கதை — வரிசைப்படுத்துவோம்</h2>
 <p>கதையின் நிகழ்வுகள் கலக்கப்பட்டுள்ளன. <b>▲ ▼</b> பொத்தான்களைப் பயன்படுத்தி அவற்றை 1 முதல் 6 வரை சரியான வரிசையில் அமைக்கவும்.</p>
 <div class="sequence" id="agSeq"></div>
 <button type="button" class="check-sequence" id="checkAg">வரிசையைச் சரிபார்</button>
 <div id="agFeedback" class="feedback" role="status" aria-live="polite"></div>

function addSequenceCard(parent,obj){
 const row=document.createElement("div"); row.className="sequence-card"; row.dataset.original=String(obj.index);
 const num=document.createElement("span"); num.className="num";
 const txt=document.createElement("span"); txt.textContent=obj.text;
 const controls=document.createElement("div"); controls.className="sequence-controls";
 const up=document.createElement("button"); up.type="button"; up.textContent="▲"; up.setAttribute("aria-label","மேலே நகர்த்து");
 const down=document.createElement("button"); down.type="button"; down.textContent="▼"; down.setAttribute("aria-label","கீழே நகர்த்து");
 up.addEventListener("click",()=>{if(row.previousElementSibling)parent.insertBefore(row,row.previousElementSibling);renumberSequence();});
 down.addEventListener("click",()=>{if(row.nextElementSibling)parent.insertBefore(row.nextElementSibling,row);renumberSequence();});
 controls.append(up,down); row.append(num,txt,controls); parent.appendChild(row);
}
function renumberSequence(){
 document.querySelectorAll("#agSeq .sequence-card").forEach((row,i)=>{row.querySelector(".num").textContent=i+1;row.classList.remove("correct-pos");});
}
function checkAgathiyar(){
 const rows=[...document.querySelectorAll("#agSeq .sequence-card")];
 const f=document.getElementById("agFeedback"); f.className="feedback show";
 let correct=0;
 rows.forEach((row,i)=>{if(Number(row.dataset.original)===i){row.classList.add("correct-pos");correct++;}else row.classList.remove("correct-pos");});
 if(correct===AGATHIYAR_STORY.length){
   f.classList.add("good"); f.textContent="🌟 அருமை! அகத்தியர் கதையை முழுவதும் சரியான வரிசையில் அமைத்துவிட்டீர்கள் — 6 / 6!";
   completed.add("agathiyar"); updateProgress();
 }else{
   f.classList.add("bad"); f.textContent="இன்னும் "+correct+" / 6 இடங்கள் மட்டும் சரியாக உள்ளன. பச்சையாகக் காட்டப்பட்டவற்றை வைத்துக் கொண்டு மற்றவற்றை மீண்டும் நகர்த்திப் பாருங்கள்.";
 }
}

function updateProgress(){
 document.getElementById("bar").style.width=(completed.size/8*100)+"%";
 document.getElementById("progressText").textContent=completed.size+" / 8 பயிற்சிகள் நிறைவு";
}
})();
