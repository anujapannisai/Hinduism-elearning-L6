<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>அலகு 9 — கூடுதல் விளையாட்டுகள்</title><style>*{box-sizing:border-box}body{margin:0;background:#f7fbf8;color:#234b46;font-family:"Noto Sans Tamil",system-ui,sans-serif;line-height:1.7}main{max-width:850px;margin:auto;padding:22px 15px 60px}.card{background:white;border:1px solid #d6e8e2;border-radius:20px;padding:20px;margin:16px 0}h1{font-size:clamp(25px,5vw,38px)}button,.tile{font:inherit;border:1px solid #aacdc1;border-radius:13px;background:white;color:#185d4f;padding:13px;cursor:pointer}button:disabled{opacity:.6}.primary{background:#087d6c;color:white}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.tile{text-align:left;min-height:115px}.tile strong{display:block}.options{display:grid;gap:9px}.options button{text-align:left}.feedback{background:#edf8f4;padding:13px;border-radius:12px;margin:12px 0}.hidden{display:none}.hint{background:#fff8dd;padding:12px;border-radius:12px}a{color:#087d6c}.muted{color:#647f78}</style></head><body><main><a href="games.html">← விளையாடிக் கற்போம்</a><h1>🎮 கூடுதல் செயல்பாடுகள்</h1><p>அலகு 9 — விரதங்களும் பண்டிகைகளும்</p><section id="menu" class="card"><h2>செயல்பாட்டைத் தேர்ந்தெடு</h2><div class="tiles"><button class="tile" onclick="start(0)">🧩 <strong>9. எது பொருந்தாது?</strong>வேறுபட்ட கருத்தைக் கண்டுபிடி</button><button class="tile" onclick="start(1)">🎭 <strong>10. நீ ஆசிரியராக இருந்தால்?</strong>இளைய மாணவருக்கு விளக்கமளி</button><button class="tile" onclick="start(2)">🔍 <strong>11. சமயத் துப்பறிவாளர்</strong>குறிப்புகளிலிருந்து விடையைக் கண்டுபிடி</button></div></section><section id="play" class="card hidden"><button onclick="back()">← செயல்பாடுகள்</button><h2 id="heading"></h2><p id="count" class="muted"></p><div id="prompt" class="hint"></div><div id="answers" class="options" style="margin-top:14px"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><button id="next" class="primary hidden" onclick="advance()">அடுத்த கேள்வி →</button></section></main><script>
const sets=[
{title:"🧩 எது பொருந்தாது?",items:[
["விரதகால ஒழுக்கங்களுடன் நேரடியாகப் பொருந்தாதது எது?",["அகத்தூய்மை","திருமுறை பாடுதல்","தான தருமம்","புத்தாடையுடன் விருந்துக் கொண்டாட்டம்"],3,"முதல் மூன்றும் விரதகால ஒழுக்கங்களாகப் பாடநூலில் குறிப்பிடப்படுகின்றன. புத்தாடையும் விருந்தும் பண்டிகைக் கொண்டாட்டத்துடன் அதிகம் தொடர்புடையவை. சில செயல்கள் இரண்டிலும் இடம்பெறலாம்."],
["பண்டிகைக் கொண்டாட்டத்தைச் சிறப்பாகக் காட்டாதது எது?",["உறவினர்களைச் சந்தித்தல்","வாழ்த்துகளைப் பகிர்தல்","குடும்பத்துடன் மகிழ்தல்","உணவைச் சுருக்கி விசேட வழிபாடு செய்தல்"],3,"உணவைச் சுருக்கி விசேட வழிபாடு செய்தல் விரதத்தின் வரையறையுடன் தொடர்புடையது. பண்டிகைகளிலும் வழிபாடு இடம்பெறலாம்."],
["பாடநூலில் பண்டிகையாகக் குறிப்பிடப்படுவது எது?",["சிவவிரதம்","சுக்கிர வார விரதம்","தைப்பொங்கல்","முருக விரதம்"],2,"தைப்பொங்கல் பண்டிகை; மற்றவை விரத வகைகள்."]]},
{title:"🎭 நீ ஆசிரியராக இருந்தால்?",items:[
["👧 விரதம் என்றால் சாப்பிடாமல் இருப்பதுதானே?",["ஆமாம். உணவு உண்ணாமல் இருப்பது மட்டுமே விரதம்.","இல்லை. மனம், வாக்கு, காயம் ஆகிய மூன்றினாலும் இறைவனை அன்புடன் விசேடமாக வழிபடுதலும் முக்கியம்.","விரதம் என்றால் ஒரு பண்டிகையைக் கொண்டாடுவது."],1,"விரதம் என்பது உணவைத் தவிர்ப்பது மட்டுமல்ல. விசேட இறை வழிபாடும் மனம், வாக்கு, காயம் ஆகியவற்றின் ஒழுக்கமும் முக்கியம்."],
["👧 விரத நாளில் ஆலயத்திற்குச் செல்வது மட்டும்தான் முக்கியமா?",["ஆமாம். ஆலயத்திற்குச் சென்றால் மற்ற ஒழுக்கங்கள் தேவையில்லை.","இல்லை. அகத்தூய்மை, புறத்தூய்மை, திருமுறை பாடுதல், தான தருமம் போன்ற ஒழுக்கங்களும் முக்கியம்.","விரத நாளில் யாருடனும் பேசக்கூடாது."],1,"பாடநூல் ஆலய வழிபாட்டுடன் தூய்மை, திருமுறை பாடுதல், தான தருமம் போன்ற ஒழுக்கங்களையும் கூறுகிறது."],
["👧 சித்திரை வருடப்பிறப்பில் ஆலயத்திற்குப் போகிறோம். அப்படியானால் அது விரதமா?",["ஆமாம். ஆலயத்திற்குச் செல்லும் எல்லா நாட்களும் விரத நாட்கள்தான்.","இல்லை. சித்திரை வருடப்பிறப்பு ஒரு பண்டிகை. அதில் ஆலய வழிபாடும் இடம்பெறுகிறது.","இல்லை. பண்டிகைகளில் இறைவழிபாடு செய்வதில்லை."],1,"சித்திரை வருடப்பிறப்பு ஒரு பண்டிகை; ஆலய வழிபாடு விரதங்களிலும் பண்டிகைகளிலும் இடம்பெறலாம்."]]},
{title:"🔍 சமயத் துப்பறிவாளர்",items:[
["சிவபெருமானுடன் தொடர்புடைய இந்த விசேட விரத அனுட்டானத்தின் பெயர் என்ன?",["சிவராத்திரி","தைப்பொங்கல்","சித்திரை வருடப்பிறப்பு"],0,"சிவராத்திரி சிவபெருமானுடன் தொடர்புடைய விரத அனுட்டானமாகும்."],
["சூரியனுக்குப் பொங்கல் படைத்து மகிழ்ச்சியாகக் கொண்டாடப்படும் பண்டிகை எது?",["கந்தசஷ்டி","தைப்பொங்கல்","சிவராத்திரி"],1,"தைப்பொங்கல் பண்டிகையாகும்."],
["முருகப்பெருமானுடன் தொடர்புடைய விரத அனுட்டானம் எது?",["சித்திரை வருடப்பிறப்பு","தீபாவளி","கந்தசஷ்டி"],2,"கந்தசஷ்டி முருகப்பெருமானுடன் தொடர்புடைய விரத அனுட்டானமாகும்."],
["சித்திரைப் பௌர்ணமியில் படிக்கப்படும் கதை எது?",["சித்திரபுத்திரனார் கதை","அகத்தியர் கதை","அரிச்சந்திரன் கதை"],0,"பாடநூல் சித்திரைப் பௌர்ணமியுடன் சித்திரபுத்திரனார் கதையைத் தொடர்புபடுத்துகிறது."]]}];
let selected=0,position=0,score=0;
const el=id=>document.getElementById(id);
function start(n){selected=n;position=0;score=0;el("menu").classList.add("hidden");el("play").classList.remove("hidden");el("heading").textContent=sets[n].title;render();scrollTo(0,0)}
function back(){window.location.href="games.html"}
function render(){const items=sets[selected].items;el("feedback").classList.add("hidden");el("next").classList.add("hidden");if(position===items.length){el("count").textContent="முடிவு";el("prompt").textContent="🏆 "+score+" / "+items.length+" சரியான விடைகள்!";el("answers").replaceChildren();const b=document.createElement("button");b.textContent="↻ மீண்டும் விளையாடு";b.onclick=()=>start(selected);el("answers").append(b);return}const q=items[position];el("count").textContent="கேள்வி "+(position+1)+" / "+items.length;el("prompt").textContent=q[0];el("answers").replaceChildren();q[1].forEach((option,i)=>{const b=document.createElement("button");b.textContent=option;b.onclick=()=>choose(i);el("answers").append(b)})}
function choose(i){const q=sets[selected].items[position];if(i===q[2])score++;el("answers").querySelectorAll("button").forEach(b=>b.disabled=true);el("feedback").textContent=(i===q[2]?"✓ சரியான விடை! ":"சரியான விடை: "+q[1][q[2]]+". ")+q[3];el("feedback").classList.remove("hidden");el("next").classList.remove("hidden")}
function advance(){position++;render()}
const requestedGame=new URLSearchParams(location.search).get("game");if(["9","10","11"].includes(requestedGame))start(Number(requestedGame)-9);else window.location.replace("games.html");
</script></body></html>
